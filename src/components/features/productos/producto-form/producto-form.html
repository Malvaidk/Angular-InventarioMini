<div class="container mt-4" style="max-width: 500px">
  <h2>{{ esEdicion ? 'Editar' : 'Nuevo' }} Producto</h2>

  <div class="mb-3">
    <label class="form-label">Nombre</label>
    <input type="text" class="form-control" [(ngModel)]="producto.nombreProducto" />
  </div>

  <div class="mb-3">
    <label class="form-label">Precio</label>
    <input type="number" class="form-control" [(ngModel)]="producto.precioProducto" />
  </div>

  <div class="mb-3">
    <label class="form-label">Existencia</label>
    <input type="number" class="form-control" [(ngModel)]="producto.existencia" />
  </div>

  <div class="mb-3">
    <label class="form-label">Categoría</label>
    <select class="form-select" [(ngModel)]="categoriaSeleccionada">
      <option [value]="0" disabled>-- Selecciona una categoría --</option>
      @for (c of categorias; track c.idCategoria) {
        <option [value]="c.idCategoria">{{ c.nombreCategoria }}</option>
      }
    </select>
  </div>

  <button (click)="guardar()" class="btn btn-success me-2">Guardar</button>
  <a routerLink="/listaProductos" class="btn btn-secondary">Cancelar</a>
</div>
