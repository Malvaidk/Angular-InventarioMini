<div class="container mt-4" style="max-width: 600px">
  <h2>Enviar Correo</h2>

  <div class="mb-3">
    <label class="form-label">Destinatarios</label>
    <input
      type="text"
      class="form-control"
      [(ngModel)]="destinatariosTexto"
      placeholder="correo1@gmail.com"
    />
  </div>

  <div class="mb-3">
    <label class="form-label">Asunto</label>
    <input type="text" class="form-control" [(ngModel)]="asunto" />
  </div>

  <div class="mb-3">
    <label class="form-label">Mensaje</label>
    <textarea class="form-control" rows="5" [(ngModel)]="mensaje"></textarea>
  </div>

  <button (click)="enviar()" class="btn btn-primary" [disabled]="enviando">
    {{ enviando ? 'Enviando...' : 'Enviar Correo' }}
  </button>

  @if (respuesta) {
    <div class="mt-3 alert alert-info">{{ respuesta }}</div>
  }
</div>
